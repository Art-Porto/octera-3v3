# Octera: the printer never compiles.
#
# Packages with C code stay at the installed version unless a ready wheel
# exists (PyPI has none for mipsel / Python 3.8). Pure-Python packages, such
# as certifi, still upgrade. pip reads <venv>/pip.conf by itself, so this
# covers the update manager's "pip install -U -r requirements.txt" and the
# runtime "pip install zstandard" of OctoEverywhere.
#
# 2026-11-05: an unpinned "pillow" made the OctoEverywhere 5.4.1 update build
# Pillow from source for minutes, fail, and retry; on the K2 the same load
# shut Klipper down ("Rescheduled timer in the past").
[global]
only-binary = pillow,zstandard
prefer-binary = true
