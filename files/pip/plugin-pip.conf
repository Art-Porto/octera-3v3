# Octera: the printer never compiles.
#
# pip takes wheels only. Pure-Python packages, such as certifi, ship
# py3-none-any wheels and still upgrade; anything with C code has no wheel
# for mipsel / Python 3.8 and stays at the installed version, or fails fast
# if it is not installed. A new compiled dependency therefore cannot start a
# build either. A pure package that only ships an sdist is allowed by name
# with "no-binary = <name>", only when a dry-run shows it is needed.
# pip reads <venv>/pip.conf by itself, so this covers the update manager's
# "pip install -U -r requirements.txt" and the runtime "pip install
# zstandard" of OctoEverywhere.
#
# 2026-11-05: an unpinned "pillow" made the OctoEverywhere 5.4.1 update build
# Pillow from source for minutes, fail, and retry; on the K2 the same load
# shut Klipper down ("Rescheduled timer in the past").
[global]
only-binary = :all:
prefer-binary = true
