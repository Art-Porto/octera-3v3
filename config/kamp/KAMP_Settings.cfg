###########################################
# KAMP Settings
###########################################

# Do not touch this section below:
[respond]                            # Necessary to receive messages from KAMP
[include Start_Print.cfg]            # START_PRINT macro for Creality K1 Series.
[include Adaptive_Meshing.cfg]       # Adaptive Meshing configurations.
[include Line_Purge.cfg]             # Adaptive Line Purging configurations.
[include Smart_Park.cfg]             # Smart Park feature, which parks the printhead near the print area for final heating.
#[include Prusa_Slicer.cfg]           # Enable this if you use Prusa Slicer, it's the necessary macros to enable Exclude Objects functionality.


[gcode_macro _KAMP_Settings]
description: This macro contains all adjustable settings for KAMP

# The following variables are settings for KAMP as a whole:

variable_verbose_enable: True               # Set to True to enable KAMP information output when running. This is useful for debugging.

# The following variables are for adjusting Adaptive Bed Mesh settings:

variable_mesh_margin: 5
variable_fuzz_amount: 0

# The following variables are for adjusting Adaptive Purge Line settings:

variable_purge_height: 0.8                  # Z position of nozzle during purge. Default is 0.8.
variable_tip_distance: 0                    # Distance between tip of filament and nozzle before purge. Default is 0.
variable_purge_margin: 10                   # Distance the purge will be in front of the print area. Default is 10.
variable_purge_amount: 50                   # Amount of filament to be purged prior to printing. Default is 50.
variable_flow_rate: 12                      # Flow rate of purge in mm3/s. Default is 12.

# The following variables are for adjusting Smart Park feature, which will park the printhead near the print area at a specified height:

variable_smart_park_height: 10              # Z position for Smart Park. Default is 10.


# Octera Adaptive Mesh v3 additions
variable_adaptive_min_probe_count: 3
variable_adaptive_bicubic_min_probe_count: 4
variable_adaptive_max_probe_count: 9
variable_mesh_time_base_sec: 55
variable_mesh_time_per_point_sec: 4.5

variable_prtouch_v1_square_safe: 1
variable_prtouch_v1_square_min_probe_count: 4
variable_prtouch_v1_square_max_probe_count: 0
# 1 = only odd grids (3, 5, 7, 9); costs up to 17 extra points per mesh.
variable_octera_odd_probe_count: 0
variable_octera_kamp_backend: "stock_prtouch_square_max"
variable_octera_rectangular_backend: "experimental_disabled"
variable_octera_full_bed_fallback: "9x9"

# Octera KAMP Mesh Reuse V1 policy. Runtime metadata remains session-only in
# the octera_mesh_reuse Klipper extra; these values document the active
# contract and are included in its auditable configuration fingerprint.
variable_reuse_loaded_mesh: 1
variable_reuse_schema: "octera-kamp-mesh-reuse-v1"
variable_reuse_coverage_margin: 1.0
variable_reuse_bed_temp_tolerance: 3.0
variable_reuse_thermal_min_absolute: 35.0
variable_reuse_thermal_drop_from_mesh: 15.0
variable_reuse_density_epsilon: 0.05
variable_reuse_sanity_max_abs: 1.0
variable_reuse_sanity_max_range: 0.80
variable_reuse_sanity_max_neighbor_jump: 0.50
variable_reuse_sanity_probe_duration_factor: 2.0
variable_reuse_sanity_probe_duration_slack: 120.0
gcode:
    RESPOND TYPE=command MSG="Running the _KAMP_Settings macro does nothing, it's only used for storing KAMP settings."


# Active live configuration for the session-only decision engine. Keeping the
# section in this already-included file avoids a printer.cfg structural edit.
[octera_mesh_reuse]
enabled: True
reuse_coverage_margin: 1.0
bed_temp_tolerance: 3.0
thermal_min_absolute: 35.0
thermal_drop_from_mesh: 15.0
density_epsilon: 0.05
sanity_max_abs: 1.0
sanity_max_range: 0.80
sanity_max_neighbor_jump: 0.50
sanity_probe_duration_factor: 2.0
sanity_probe_duration_slack: 120.0
mesh_time_base: 55.0
mesh_time_per_point: 4.5
verbose: True
# Verified reuse (V2): when the session mesh cannot be reused, probe a 3x3 on
# nodes of the last accepted mesh (stored in printer_data) and reuse it if
# every node is within verify_tolerance. Measured PRTouch repeatability on
# 2026-10-02: +-0.02 mm.
verify_enabled: True
verify_tolerance: 0.05
verify_min_full_count: 5
verify_max_age_hours: 168
