###########################################
# Adaptive Bed Meshing Macros
# Octera v3: axis-independent mesh + min/max caps + time estimate
###########################################

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _BED_MESH_CALIBRATE
gcode:
    {% set all_points = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}
    {% set bed_mesh_min = printer.configfile.settings.bed_mesh.mesh_min %}
    {% set bed_mesh_max = printer.configfile.settings.bed_mesh.mesh_max %}
    {% set probe_count = printer.configfile.settings.bed_mesh.probe_count %}
    {% set kamp_settings = printer["gcode_macro _KAMP_Settings"] %}
    {% set verbose_enable = kamp_settings.verbose_enable | abs %}
    {% set mesh_margin = kamp_settings.mesh_margin | float %}
    {% set reuse_coverage_margin = kamp_settings.reuse_coverage_margin | default(0.0) | float %}
    {% set effective_mesh_margin = mesh_margin + reuse_coverage_margin %}
    {% set fuzz_amount = kamp_settings.fuzz_amount | float %}

    # Optional tuning values. If they are not present in _KAMP_Settings, safe defaults are used.
    {% set adaptive_min_probe_count = [kamp_settings.adaptive_min_probe_count | default(3) | int, 3] | max %}
    {% set adaptive_bicubic_min_probe_count = [kamp_settings.adaptive_bicubic_min_probe_count | default(4) | int, 4] | max %}
    {% set adaptive_max_probe_count = kamp_settings.adaptive_max_probe_count | default(0) | int %}
    {% set mesh_time_base_sec = kamp_settings.mesh_time_base_sec | default(55) | float %}
    {% set mesh_time_per_point_sec = kamp_settings.mesh_time_per_point_sec | default(4.5) | float %}
    {% set octera_kamp_backend = kamp_settings.octera_kamp_backend | default("stock_prtouch_square_max") | string %}
    {% set octera_rectangular_backend = kamp_settings.octera_rectangular_backend | default("experimental_disabled") | string %}
    {% set octera_full_bed_fallback = kamp_settings.octera_full_bed_fallback | default("9x9") | string %}

    {% set probe_count = probe_count if probe_count|length > 1 else probe_count * 2 %}
    {% set configured_max_x = probe_count[0] | int %}
    {% set configured_max_y = probe_count[1] | int %}
    {% if adaptive_max_probe_count > 0 %}
        {% set configured_max_x = [configured_max_x, [adaptive_max_probe_count, 3] | max] | min %}
        {% set configured_max_y = [configured_max_y, [adaptive_max_probe_count, 3] | max] | min %}
    {% endif %}

    {% set full_span_x = bed_mesh_max[0] - bed_mesh_min[0] %}
    {% set full_span_y = bed_mesh_max[1] - bed_mesh_min[1] %}
    {% set max_probe_point_distance_x = full_span_x / (probe_count[0] - 1) %}
    {% set max_probe_point_distance_y = full_span_y / (probe_count[1] - 1) %}

    {% set x_min = all_points | map(attribute=0) | min | default(bed_mesh_min[0]) %}
    {% set y_min = all_points | map(attribute=1) | min | default(bed_mesh_min[1]) %}
    {% set x_max = all_points | map(attribute=0) | max | default(bed_mesh_max[0]) %}
    {% set y_max = all_points | map(attribute=1) | max | default(bed_mesh_max[1]) %}

    {% set fuzz_range = range((0) | int, (fuzz_amount * 100) | int + 1) %}
    {% set adapted_x_min = x_min - effective_mesh_margin - (fuzz_range | random / 100.0) %}
    {% set adapted_y_min = y_min - effective_mesh_margin - (fuzz_range | random / 100.0) %}
    {% set adapted_x_max = x_max + effective_mesh_margin + (fuzz_range | random / 100.0) %}
    {% set adapted_y_max = y_max + effective_mesh_margin + (fuzz_range | random / 100.0) %}

    {% set adapted_x_min = [adapted_x_min, bed_mesh_min[0]] | max %}
    {% set adapted_y_min = [adapted_y_min, bed_mesh_min[1]] | max %}
    {% set adapted_x_max = [adapted_x_max, bed_mesh_max[0]] | min %}
    {% set adapted_y_max = [adapted_y_max, bed_mesh_max[1]] | min %}

    {% set mesh_span_x = adapted_x_max - adapted_x_min %}
    {% set mesh_span_y = adapted_y_max - adapted_y_min %}

    # Axis-independent count. Do not force square grids.
    {% set raw_points_x = ((mesh_span_x / max_probe_point_distance_x) | round(method='ceil') | int) + 1 %}
    {% set raw_points_y = ((mesh_span_y / max_probe_point_distance_y) | round(method='ceil') | int) + 1 %}

    # Bicubic needs at least 4 points on each axis. Lagrange is kept for small meshes.
    {% if (([raw_points_x, raw_points_y] | max) > 6) and (configured_max_x >= adaptive_bicubic_min_probe_count) and (configured_max_y >= adaptive_bicubic_min_probe_count) %}
        {% set algorithm = "bicubic" %}
        {% set min_points = adaptive_bicubic_min_probe_count %}
    {% else %}
        {% set algorithm = "lagrange" %}
        {% set min_points = adaptive_min_probe_count %}
    {% endif %}

    {% set points_x = [raw_points_x, min_points] | max %}
    {% set points_y = [raw_points_y, min_points] | max %}
    {% set points_x = [points_x, configured_max_x] | min %}
    {% set points_y = [points_y, configured_max_y] | min %}

    {% set prtouch_v1_square_safe = printer['gcode_macro _KAMP_Settings'].prtouch_v1_square_safe | default(0) | int %}
    {% set prtouch_v1_square_min_probe_count = printer['gcode_macro _KAMP_Settings'].prtouch_v1_square_min_probe_count | default(4) | int %}
    # A value of 0 means the full configured bed_mesh cap. A positive value may
    # only lower that cap explicitly; it never silently defaults to 5x5.
    {% set prtouch_v1_square_max_probe_count = printer['gcode_macro _KAMP_Settings'].prtouch_v1_square_max_probe_count | default(0) | int %}
    {% if prtouch_v1_square_safe == 1 and points_x != points_y %}
        {% set prtouch_square_cap = [configured_max_x, configured_max_y] | min %}
        {% if prtouch_v1_square_max_probe_count > 0 %}
            {% set prtouch_square_cap = [prtouch_square_cap, [prtouch_v1_square_max_probe_count, 3] | max] | min %}
        {% endif %}
        {% set square_points = [points_x, points_y, prtouch_v1_square_min_probe_count] | max %}
        {% set square_points = [square_points, prtouch_square_cap] | min %}
        {% set points_x = square_points %}
        {% set points_y = square_points %}
    {% endif %}
    {% set octera_square_safe_marker = 'OCTERA_SQUARE_MAX' %}

    # Odd grids only (3, 5, 7, 9): an even count is raised to the next odd
    # one, or lowered when that would exceed the configured cap.
    {% set octera_odd_probe_count = kamp_settings.octera_odd_probe_count | default(0) | int %}
    {% if octera_odd_probe_count == 1 %}
        {% if points_x % 2 == 0 %}
            {% set points_x = points_x + 1 if points_x + 1 <= configured_max_x else [points_x - 1, 3] | max %}
        {% endif %}
        {% if points_y % 2 == 0 %}
            {% set points_y = points_y + 1 if points_y + 1 <= configured_max_y else [points_y - 1, 3] | max %}
        {% endif %}
        # Lagrange supports at most 6 points per axis.
        {% if ([points_x, points_y] | max) > 6 %}
            {% set algorithm = "bicubic" %}
        {% else %}
            {% set algorithm = "lagrange" %}
        {% endif %}
    {% endif %}

    {% set point_total = points_x * points_y %}
    {% set estimated_seconds = (mesh_time_base_sec + (point_total * mesh_time_per_point_sec)) | int %}
    {% set estimated_minutes = (estimated_seconds / 60.0) | round(1) %}
    {% set spacing_x = (mesh_span_x / (points_x - 1)) | round(2) %}
    {% set spacing_y = (mesh_span_y / (points_y - 1)) | round(2) %}

    {% if verbose_enable == True %}
        {% if printer.exclude_object.objects != [] %}
            RESPOND TYPE=command MSG="Algorithm: {algorithm}"
            RESPOND TYPE=command MSG="Default probe count: {probe_count[0]},{probe_count[1]}"
            RESPOND TYPE=command MSG="Adaptive min/max: min={adaptive_min_probe_count}, bicubic_min={adaptive_bicubic_min_probe_count}, max={configured_max_x},{configured_max_y}"
            RESPOND TYPE=command MSG="Raw adapted probe count: {raw_points_x},{raw_points_y}"
            RESPOND TYPE=command MSG="Octera KAMP backend={octera_kamp_backend} rectangular={octera_rectangular_backend} full_bed_fallback={octera_full_bed_fallback}"
            RESPOND TYPE=command MSG="PRTouch v1 square-max enabled configured_cap={configured_max_x},{configured_max_y} explicit_cap={prtouch_v1_square_max_probe_count} odd_only={octera_odd_probe_count}"
            RESPOND TYPE=command MSG="Final adapted probe count: {points_x},{points_y} ({point_total} points)"
            RESPOND TYPE=command MSG="Estimated mesh time: ~{estimated_minutes} min ({estimated_seconds}s) using {mesh_time_base_sec}s base + {mesh_time_per_point_sec}s/point"
            RESPOND TYPE=command MSG="Default mesh bounds: {bed_mesh_min[0]},{bed_mesh_min[1]}, {bed_mesh_max[0]},{bed_mesh_max[1]}"
            RESPOND TYPE=command MSG="Adapted mesh bounds: {adapted_x_min},{adapted_y_min}, {adapted_x_max},{adapted_y_max}"
            RESPOND TYPE=command MSG="Mesh span X={mesh_span_x|round(2)}mm Y={mesh_span_y|round(2)}mm"
            RESPOND TYPE=command MSG="Final mesh spacing approx X={spacing_x}mm Y={spacing_y}mm"
            RESPOND TYPE=command MSG="Reuse coverage margin is {reuse_coverage_margin}mm, effective calibration margin is {effective_mesh_margin}mm."
            {% if mesh_margin > 0 %}
                RESPOND TYPE=command MSG="Mesh margin is {mesh_margin}, mesh bounds extended by {mesh_margin}mm."
            {% else %}
                RESPOND TYPE=command MSG="Mesh margin is 0, margin not increased."
            {% endif %}
            {% if fuzz_amount > 0 %}
                RESPOND TYPE=command MSG="Mesh point fuzzing enabled, points fuzzed up to {fuzz_amount}mm"
            {% else %}
                RESPOND TYPE=command MSG="Fuzz amount is 0, mesh points not fuzzed."
            {% endif %}
            RESPOND TYPE=command MSG="KAMP adjustments successful."
        {% else %}
            RESPOND TYPE=command MSG="No object detected. Using full-bed {octera_full_bed_fallback} fallback with current adaptive limits."
            G4 P1000
        {% endif %}
    {% endif %}

    _BED_MESH_CALIBRATE MESH_MIN={adapted_x_min},{adapted_y_min} MESH_MAX={adapted_x_max},{adapted_y_max} ALGORITHM={algorithm} PROBE_COUNT={points_x},{points_y}
